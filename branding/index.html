<!DOCTYPE html>
<html>
    <head>
        <link href="https://fonts.googleapis.com/css?family=Helvetica+Neue&display=swap" rel="stylesheet" />
        <link href="./css/style.css" rel="stylesheet" />
        <title>TN Luanguthai</title>
    </head>
    <body>
        <div class="dropdown">
            <button class="dropbtn">+</button>
            <div class="dropdown-content">
              <a href="https://thetornor.github.io/portfolio/home/">about me</a>
              <a href="https://thetornor.github.io/portfolio/resume/">resume</a>
              <a href="https://thetornor.github.io/portfolio/works/">works</a>
            </div>
        </div>
        <div class="split left">
        <div class="centered">
            <h1>BRANDING DESIGN</h1>
        </div>
        </div>
        
        <div class="split right">
          <div class="centered">
            <div class="block">
                <h4 id="WL"> Wedding label</h4>
                <hr>
                <div id="WLimg">
                    <img src="./images/T-1.png">
                    <img src="./images/T-2.png">
                    <img src="./images/T-6.png">
                    <img src="./images/T-3.png">
                    <img src="./images/T-4.png">
                    <img src="./images/T-5.png">
                </div>
                <h4 class="CL"> Cafe logo</h4>
                <hr>
                <div id="CLimg">
                    <img src="./images/gather.png">
                    <img src="./images/gather2.png">
                    <img src="./images/gather3.png">
                    <img src="./images/gather4.png">
                </div>
                <h4 id="BL"> Bakery logo</h4>
                <div  id="BLimg">
                    <img src="./images/ky1.png">
                    <img src="./images/ky2.png">
                    <img src="./images/ky3.jpeg">
                    <img src="./images/ky4.png">
                    <img src="./images/ky5.png">
                </div>
                <hr>
                <h4 id="RB">Birthday logo</h4>
                <div  id="RBimg">
                    <img src="./images/rb60.jpg">
                    <img src="./images/rb60-2.jpg">
                    <img src="./images/rb60-3.jpg">
                    <img src="./images/rb60-4.jpg">
                    <img src="./images/rb60-5.jpg">
                </div>
                <hr>
                <h4 id="CB"> Clothing brand</h4>
                <div  id="CBimg">
                    <img src="./images/2o5.png">
                    <img src="./images/2o5-2.png">
            </div>
          </div>
        </div>
</div>

<script>
    function toggleVisibility(id) {
        var element = document.getElementById(id);
        if (element.style.display === "none" || element.style.display === "") {
            element.style.display = "block";
        } else {
            element.style.display = "none";
        }
    }

    document.getElementById("WL").addEventListener("click", function() {
        toggleVisibility("WLimg");
    });

    document.getElementById("CL").addEventListener("click", function() {
        toggleVisibility("CLimg");
    });

    document.getElementById("BL").addEventListener("click", function() {
        toggleVisibility("BLimg");
    });

    document.getElementById("RB").addEventListener("click", function() {
        toggleVisibility("RBimg");
    });

    document.getElementById("CB").addEventListener("click", function() {
        toggleVisibility("CBimg");
    });
</script>
</body>
</html>
